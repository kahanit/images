name: Build and push

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: redis-cluster
            tag: 8.10.3-r1
          - image: redis-exporter
            tag: 1.97.0
          - image: os-shell
            tag: "12"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: docker.io/kahanit/${{ matrix.image }}:${{ matrix.tag }}
