name: Build and push

# Builds the three images, scans them and pushes them to Docker Hub.
# - every Monday 02:00 UTC: a rebuild of the same sources, which picks up
#   Debian's package fixes (the Dockerfiles run `apt-get upgrade`)
# - on a push to main that touches an image folder or this file
# - by hand (Actions -> Build and push -> Run workflow)
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "redis-cluster/**"
      - "redis-exporter/**"
      - "os-shell/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A registry that exists only for the length of the job.
    services:
      registry:
        image: registry:2.8.3
        ports:
          - 5000:5000
    strategy:
      fail-fast: false
      matrix:
        # The tag comes from the Dockerfile (APP_VERSION, IMAGE_REVISION), so
        # an upstream update needs no change here.
        #   revision: true  -> <version>-r<revision>   (8.10.3-r1)
        #   revision: false -> <version>               (1.97.0, 12)
        include:
          - image: redis-cluster
            revision: true
          - image: redis-exporter
            revision: false
          - image: os-shell
            revision: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out the tags
        id: tags
        env:
          IMAGE: ${{ matrix.image }}
          WITH_REVISION: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          version=$(grep -oP 'APP_VERSION="\K[^"]+' "$IMAGE/Dockerfile")
          revision=$(grep -oP 'IMAGE_REVISION="\K[^"]+' "$IMAGE/Dockerfile")
          tag="$version"
          if [ "$WITH_REVISION" = "true" ]; then tag="$version-r$revision"; fi
          repo="docker.io/kahanit/$IMAGE"
          # A dated tag is never moved: if today's exists already (a second
          # run on the same day), the run number is added.
          dated="$tag-$(date -u +%Y%m%d)"
          if docker manifest inspect "$repo:$dated" >/dev/null 2>&1; then
            dated="$dated-$GITHUB_RUN_NUMBER"
          fi
          {
            echo "repo=$repo"
            echo "tag=$tag"
            echo "dated=$dated"
          } >> "$GITHUB_OUTPUT"
          echo "### $IMAGE: \`$repo:$dated\` and \`$repo:$tag\`" >> "$GITHUB_STEP_SUMMARY"

      # The runner's buildx can reach the job's own registry on localhost.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      # Built and pushed to the registry that lives only inside this job
      # (services: below); Docker Hub gets nothing until the scan has
      # passed. No cache: every run installs today's packages.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          provenance: false
          tags: localhost:5000/${{ matrix.image }}:scan

      # Trivy reads the image from that registry. (Reading it out of the
      # runner's Docker or from a saved file failed with "failed to extract
      # the archive", Trivy 0.76.1, 2026-11-10.)
      # Fails the job on a critical vulnerability that has a fix. Ones
      # without a fix are listed by the next step but do not block.
      - name: Scan (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_NON_SSL: "true"
          TRIVY_IMAGE_SRC: remote
        with:
          version: v0.76.1
          image-ref: localhost:5000/${{ matrix.image }}:scan
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan (report only, high and critical, fixed or not)
        if: always() && steps.tags.outputs.dated != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_NON_SSL: "true"
          TRIVY_IMAGE_SRC: remote
        with:
          version: v0.76.1
          image-ref: localhost:5000/${{ matrix.image }}:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"

      # Copies the scanned image, unchanged, to Docker Hub under both tags.
      - name: Push
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE: ${{ matrix.image }}
          REPO: ${{ steps.tags.outputs.repo }}
          TAG: ${{ steps.tags.outputs.tag }}
          DATED: ${{ steps.tags.outputs.dated }}
        run: |
          set -euo pipefail
          for tag in "$DATED" "$TAG"; do
            skopeo copy --src-tls-verify=false \
              --dest-username "$DOCKERHUB_USERNAME" --dest-password "$DOCKERHUB_TOKEN" \
              "docker://localhost:5000/$IMAGE:scan" "docker://$REPO:$tag"
          done

  notify:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are not set; no message sent"
            exit 0
          fi
          curl -sS --fail-with-body -o /dev/null \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=kahanit/images: the image build failed (build or scan). ${RUN_URL}"
